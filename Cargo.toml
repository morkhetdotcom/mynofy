[workspace]
resolver = "3"
members = [
    "crates/mynofy-protocol",
    "crates/mynofy-server",
    "crates/mynofy-client",
    "crates/mynofy-cli",
    "sdks/c",
]
default-members = ["crates/mynofy-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
saphyr-parser = { version = "0.3.4", default-features = false }
rustix = { version = "1.1.6", default-features = false, features = ["std"] }
nix = { version = "0.31.3", default-features = false, features = ["user"] }
prost = "0.14.5"
bytes = { version = "1", features = ["serde"] }
mynofy-protocol = { path = "crates/mynofy-protocol" }
mynofy-server = { path = "crates/mynofy-server" }
mynofy-client = { path = "crates/mynofy-client" }
aws-lc-rs = "1"
base64 = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
zeroize = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Optimized heap profiling with allocation call stacks; normal release stays stripped.
[profile.profiling]
inherits = "release"
debug = 1
strip = false
