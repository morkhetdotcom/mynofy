[package]
name = "mynofy-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "mynofy server and client command line"
default-run = "mynofy"

[[bin]]
name = "mynofy"
path = "src/main.rs"

[dependencies]
mynofy-protocol = { workspace = true, features = ["crypto"] }
mynofy-server.workspace = true
mynofy-client.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "signal", "process"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["process", "thread", "termios", "fs"] }

[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
nix.workspace = true

[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies.rustix]
workspace = true
features = ["termios", "fs"]
