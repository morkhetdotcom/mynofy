[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mynofy-client"
version = "0.2.0"
description = "Native asyncio client for mynofy: Protobuf, WSS and Unix sockets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44,<51",
    "protobuf>=7.36.2,<8",
    "websockets>=15,<18",
]

[project.optional-dependencies]
dev = ["grpcio-tools==1.85.1", "build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]
